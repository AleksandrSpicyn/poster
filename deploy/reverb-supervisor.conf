[program:poster-reverb]
directory=/var/www/poster
command=/usr/bin/php8.4 /var/www/poster/artisan reverb:start --host=127.0.0.1 --port=8080
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/poster/storage/logs/reverb.log
stopwaitsecs=30
