name: poster

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  working_dir: /var/www
  volumes:
    - .:/var/www
    - ./.env.docker:/var/www/.env:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - '127.0.0.1:5178:5178'
  web:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:8088:80'
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: poster
      POSTGRES_USER: poster
      POSTGRES_PASSWORD: local-poster
    ports:
      - '127.0.0.1:5438:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poster -d poster']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  horizon:
    <<: *app
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: php artisan horizon
    profiles: [workers]
  scheduler:
    <<: *app
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: php artisan schedule:work
    profiles: [workers]

volumes:
  postgres_data:
  redis_data:
