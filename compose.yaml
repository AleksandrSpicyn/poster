name: poster

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  environment:
    - OPUS_CLIP_API_KEY
    - YOUTUBE_DATA_API_KEY
  working_dir: /var/www
  volumes:
    - .:/var/www
    - ./.env.docker:/var/www/.env:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - '127.0.0.1:5178:5178'
  web:
    image: nginx:stable-alpine
    ports:
      - '127.0.0.1:8088:80'
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app, reverb]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: poster
      MYSQL_USER: poster
      MYSQL_PASSWORD: local-poster
      MYSQL_ROOT_PASSWORD: local-poster-root
    ports:
      - '127.0.0.1:3308:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/01-create-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '--host=127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  horizon:
    <<: *app
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: php artisan horizon
    profiles: [workers]
  reverb:
    <<: *app
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
  scheduler:
    <<: *app
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: php artisan schedule:work
    profiles: [workers]

volumes:
  mysql_data:
  redis_data:
